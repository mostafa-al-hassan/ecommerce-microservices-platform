spring:
    application:
        name: wallet-service
    datasource:
        url: jdbc:mysql://localhost:3306/wallet_db?useSSL=false&allowPublicKeyRetrieval=true
        username: wallet_user
        password: wallet_pass
        driver-class-name: com.mysql.cj.jdbc.Driver
logging:
    level:
        org.hibernate.SQL: DEBUG # Shows actual SQL statements
        org.hibernate.type.descriptor.sql.BasicBinder: TRACE # Shows parameter values
        org.hibernate.tool.hbm2ddl: DEBUG # Shows DDL (create/alter table) statements

server:
    port: 8081
