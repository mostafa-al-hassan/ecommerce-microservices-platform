spring:
    application:
        name: wallet-service
    datasource:
        url: jdbc:mysql://localhost:3306/wallet_db?useSSL=false&allowPublicKeyRetrieval=true
        username: wallet_user
        password: wallet_pass
        driver-class-name: com.mysql.cj.jdbc.Driver
    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true
server:
    port: 8081
eureka:
    client:
        service-url:
            defaultZone: http://localhost:8761/eureka/
    instance:
        prefer-ip-address: true
logging:
    level:
        org.hibernate.SQL: DEBUG # Shows actual SQL statements
        org.hibernate.type.descriptor.sql.BasicBinder: TRACE # Shows parameter values
        org.hibernate.tool.hbm2ddl: DEBUG # Shows DDL (create/alter table) statements
jwt:
    # A 256-bit key (32 bytes) encoded in Base64.
    # Replace this with your own generated key for production!
    secret: 4b3c2a1d9e8f7g6h5i4j3k2l1m0n9o8p7q6r5s4t3u2v1w0x9y8z7a6b5c4d3e2f1
    # Token expiration time in milliseconds (24 hours)
    expiration: 86400000
